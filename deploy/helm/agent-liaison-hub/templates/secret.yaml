{{- if not .Values.existingSecret }}
{{- $name := include "hub.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $nextauth := .Values.auth.nextauthSecret }}
{{- if and (not $nextauth) $existing }}
{{- $nextauth = index $existing.data "NEXTAUTH_SECRET" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "hub.databaseUrl" . | quote }}
  REDIS_URL: {{ include "hub.redisUrl" . | quote }}
  NEXTAUTH_SECRET: {{ default (randAlphaNum 48) $nextauth | quote }}
  GITHUB_APP_CLIENT_SECRET: {{ .Values.github.clientSecret | quote }}
  GITHUB_APP_PRIVATE_KEY: {{ .Values.github.privateKey | quote }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.github.webhookSecret | quote }}
  SLACK_WEBHOOK_URL: {{ .Values.notifications.slackWebhookUrl | quote }}
  SMTP_URL: {{ .Values.notifications.smtpUrl | quote }}
{{- end }}
