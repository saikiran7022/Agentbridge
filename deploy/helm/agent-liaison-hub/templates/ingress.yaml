{{- if .Values.ingress.enabled }}
# The web app serves the UI, /api, /api/mcp, /cli/hub.mjs and /webhooks/github, so one backend is enough.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hub.fullname" . }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hub.fullname" . }}-web
                port:
                  name: http
{{- end }}
